<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create and find flows</title>
<!-- Static design mock-up (docs/design-2026-10.md). Not production code. Open by double-click; add #long to the URL to unroll every screen. -->
<style>
@font-face{font-family:Inter;src:url(assets/inter-latin.woff2) format('woff2');font-weight:100 900;font-display:swap}
@font-face{font-family:'Architects Daughter';src:url(assets/architects-daughter-latin.woff2) format('woff2');font-weight:400;font-display:swap}
:root{--night-900:#151719;--night-800:#25282C;--night-700:#33363A;--night-400:#9BA9B4;--night-300:#C5D2DC;--earth:#42210B;--sun:#FF8506;--sun-200:#FFE2BF;--sun-50:#FFF3E3;--clay:#A95700;--clay-700:#7B3F00;--paper:#FFFFFF;--sand:#FBF6EF;--line:#E7DED3;--field:#857A70;--muted:#55595F;--ink:#151719;--leaf:#157F3B;--leaf-50:#EAF6EE;--danger:#B42318;--you:#1A73E8;
--sh1:0 1px 2px rgba(66,33,11,.08),0 4px 12px -2px rgba(66,33,11,.12);--sh2:0 2px 4px rgba(66,33,11,.08),0 18px 36px -10px rgba(66,33,11,.28)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:#E8E2D9 url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20width%3D'180'%20height%3D'180'%20viewBox%3D'0%200%20180%20180'%3E%3Cg%20fill%3D'none'%20stroke%3D'rgba(66%2C33%2C11%2C.06)'%20stroke-width%3D'2'%3E%3Cpath%20d%3D'M0%2040Q60%2030%2090%2060T180%2040'%2F%3E%3Cpath%20d%3D'M40%200Q50%2060%2030%20110T40%20180'%2F%3E%3Cpath%20d%3D'M0%20130Q90%20150%20180%20130'%2F%3E%3Cpath%20d%3D'M120%200Q110%2050%20140%2090T120%20180'%2F%3E%3Ccircle%20cx%3D'90'%20cy%3D'60'%20r%3D'7'%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E");color:var(--ink);padding:36px 20px 60px;-webkit-font-smoothing:antialiased}
.top{max-width:1240px;margin:0 auto 30px;display:flex;gap:18px;align-items:center}
.top img{height:54px}.top h1{font-size:26px;letter-spacing:-.02em;line-height:1.15}.top p{color:var(--muted);font-size:15px;max-width:820px;margin-top:4px}
.top nav{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}.top nav a{font-size:14px;font-weight:700;color:var(--clay-700);background:#fff;border-radius:999px;padding:8px 14px;text-decoration:none;box-shadow:var(--sh1)}
.frames{display:flex;flex-wrap:wrap;gap:44px 36px;justify-content:center;align-items:flex-start;max-width:1500px;margin:0 auto}
.fw{width:380px}
.fw figcaption{min-height:62px;margin-bottom:12px;font-size:14px;line-height:1.4;color:var(--muted)}
.fw figcaption b{display:block;font-size:16px;color:var(--ink);margin-bottom:2px}
.phone{width:380px;height:780px;padding:10px;border-radius:46px;background:#0B0C0D;box-shadow:0 0 0 2px #2B2D30,0 40px 80px -30px rgba(21,23,25,.6)}
.screen{position:relative;width:360px;height:760px;border-radius:36px;overflow:hidden;background:var(--sand);font-size:16px;line-height:1.5;letter-spacing:-.006em}
.scroll{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}
.pb-nav{padding-bottom:100px}.pb-bar{padding-bottom:110px}
body.long .phone{height:auto}body.long .screen{height:auto}body.long .scroll{position:relative;inset:auto;overflow:visible}body.long .nav,body.long .actionbar{position:relative}body.long .pb-nav,body.long .pb-bar{padding-bottom:0}
.ic{flex:none;display:block}
/* status + app bars */
.sb{height:28px;display:flex;align-items:center;justify-content:space-between;padding:4px 22px 0;font-size:13px;font-weight:600;position:relative;z-index:6}
.sb .sbi{display:flex;gap:6px;align-items:center}
.sb.dark{background:var(--night-900);color:#fff}.sb.light{background:#fff;color:var(--ink)}.sb.clear{position:absolute;top:0;left:0;right:0;color:var(--ink)}
.appbar{height:60px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 12px 0 16px;position:relative;z-index:3}
.appbar.dark{background:var(--night-900);color:#fff}.appbar.light{background:#fff;box-shadow:0 1px 0 var(--line)}
.appbar .ttl{font-size:18px;font-weight:800;letter-spacing:-.01em;flex:1}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:23px;letter-spacing:-.03em}
.badge{border-radius:12px;background:var(--sun-50);display:grid;place-items:center;flex:none;box-shadow:inset 0 -2px 0 rgba(66,33,11,.14)}
.lang{display:flex;background:var(--sun-50);border-radius:999px;padding:4px;box-shadow:inset 0 0 0 1px var(--line)}
.lang.dark{background:rgba(255,255,255,.08);box-shadow:none}
.lang b{min-width:46px;height:40px;display:grid;place-items:center;border-radius:999px;font-size:15px;font-weight:700;color:var(--muted)}
.lang.dark b{color:var(--night-300)}.lang b.on{background:var(--sun);color:var(--night-900);box-shadow:inset 0 -2px 0 var(--clay)}
.iconbtn{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex:none;color:inherit}
.iconbtn.white{background:#fff;color:var(--ink);box-shadow:var(--sh1)}
.txtbtn{height:48px;display:flex;align-items:center;gap:6px;padding:0 10px;border-radius:12px;font-weight:700;font-size:15px;color:var(--clay-700)}
/* type */
.hand{font-family:'Architects Daughter','Segoe Print',cursive;font-size:20px;line-height:1.25;color:var(--sun)}
.hand.clay{color:var(--clay)}
h1.d{font-size:31px;line-height:1.1;font-weight:800;letter-spacing:-.03em}
h1.t{font-size:26px;line-height:1.15;font-weight:800;letter-spacing:-.025em}
h2.s{font-size:20px;line-height:1.3;font-weight:800;letter-spacing:-.015em}
.hl{color:var(--sun);background:url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%20120%2010'%20preserveAspectRatio%3D'none'%3E%3Cpath%20d%3D'M2%207C30%202%2070%201%20118%205'%20fill%3D'none'%20stroke%3D'%23FF8506'%20stroke-width%3D'3.2'%20stroke-linecap%3D'round'%2F%3E%3C%2Fsvg%3E") left bottom/100% 9px no-repeat;padding-bottom:5px}
.muted{color:var(--muted)}.small{font-size:14px}
/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:58px;border-radius:16px;font-weight:700;font-size:17px;letter-spacing:-.01em;padding:0 18px;text-align:center}
.btn-primary{background:var(--sun);color:var(--night-900);box-shadow:inset 0 -3px 0 var(--clay),0 12px 22px -12px rgba(169,87,0,.85)}
.btn-primary .bi{width:36px;height:36px;border-radius:50%;background:var(--night-900);color:var(--sun);display:grid;place-items:center;margin-left:-6px}
.btn-dark{background:var(--night-900);color:#fff}
.btn-outline{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 2px var(--night-900)}
.btn-white{background:#fff;color:var(--ink);box-shadow:inset 0 -3px 0 #D9CFC2}
.btn-ghost{background:transparent;color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.4)}
.btn-wa{background:var(--leaf);color:#fff;box-shadow:inset 0 -3px 0 #0D5A28,0 12px 22px -12px rgba(21,127,59,.8)}
.btn[aria-disabled=true]{background:#E9E2D8;color:var(--muted);box-shadow:none}
.row{display:flex;gap:10px}.row .btn{flex:1;font-size:16px;gap:8px;padding:0 10px}
.linkbtn{min-height:48px;display:inline-flex;align-items:center;gap:6px;color:var(--clay-700);font-weight:700}
/* fields */
.lbl{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;margin-bottom:8px}
.lbl small{font-weight:500;color:var(--muted);font-size:14px}
.field{display:flex;align-items:center;gap:10px;min-height:60px;border:2px solid var(--field);border-radius:14px;background:#fff;padding:0 6px 0 14px;font-size:17px;color:var(--ink)}
.field .ph{flex:1;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.field .val{flex:1;font-weight:500}
.field.focus{border-color:var(--clay);box-shadow:0 0 0 4px var(--sun-200)}
.field.area{align-items:flex-start;padding:12px 14px;min-height:96px;line-height:1.45}
.field .go{height:48px;padding:0 16px;border-radius:10px;background:var(--night-900);color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;gap:6px}
.help{font-size:15px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between;gap:10px}
.fgroup{margin-bottom:18px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;height:48px;padding:0 14px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--field);font-weight:600;font-size:15px}
.tag{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;background:var(--sun-50);color:var(--clay-700);font-weight:700;font-size:14px}
/* map */
.map{position:relative;overflow:hidden;background:#F3ECE0}
.map svg.base{position:absolute;inset:0;width:100%;height:100%;display:block}
.mchip{position:absolute;display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:0 12px;height:36px;font-size:14px;font-weight:700;box-shadow:var(--sh1);color:var(--ink);z-index:2}
.mchip i{width:10px;height:10px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 2px var(--earth)}
.mbtn{position:absolute;height:48px;padding:0 16px;border-radius:999px;background:var(--night-900);color:#fff;display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;box-shadow:0 8px 18px -6px rgba(21,23,25,.6);z-index:2}
.attr{position:absolute;left:8px;bottom:6px;font-size:10px;line-height:16px;color:#33363A;background:rgba(255,255,255,.75);padding:0 5px;border-radius:4px;z-index:2}
.pin{position:absolute;width:34px;height:45px;transform:translate(-50%,-100%);z-index:1}
.pin svg{display:block;overflow:visible}
.pin.big{width:50px;height:66px;z-index:3;animation:drop .7s cubic-bezier(.3,1.5,.5,1) both}
.pin.big::after{content:"";position:absolute;left:50%;bottom:-6px;width:40px;height:14px;transform:translateX(-50%);border-radius:50%;box-shadow:0 0 0 3px rgba(255,133,6,.45);animation:ring 2s ease-out infinite}
.cluster{position:absolute;transform:translate(-50%,-50%);width:40px;height:40px;border-radius:50%;background:var(--night-900);color:#fff;font-weight:800;font-size:15px;display:grid;place-items:center;box-shadow:0 0 0 3px var(--sun),0 0 0 6px rgba(255,255,255,.95),0 8px 16px rgba(21,23,25,.35);z-index:1}
.cluster.l{width:50px;height:50px;font-size:17px}
.you{position:absolute;width:20px;height:20px;border-radius:50%;background:var(--you);border:3px solid #fff;transform:translate(-50%,-50%);box-shadow:0 2px 6px rgba(0,0,0,.35);z-index:2}
.you::after{content:"";position:absolute;inset:-16px;border-radius:50%;background:rgba(26,115,232,.2);animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{transform:scale(.35);opacity:1}100%{transform:scale(1.5);opacity:0}}
@keyframes ring{0%{transform:translateX(-50%) scale(.5);opacity:1}100%{transform:translateX(-50%) scale(1.8);opacity:0}}
@keyframes drop{0%{transform:translate(-50%,-170%);opacity:0}55%{opacity:1}100%{transform:translate(-50%,-100%)}}
@keyframes rise{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
/* nav */
.nav{position:absolute;left:0;right:0;bottom:0;height:78px;display:flex;align-items:flex-end;padding:0 6px 8px;z-index:10}
.nav.light{background:#fff;box-shadow:0 -1px 0 var(--line),0 -10px 24px -14px rgba(66,33,11,.25)}
.nav.dark{background:var(--night-900)}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;font-size:14px;font-weight:600;min-height:62px;color:var(--muted)}
.nav.dark a{color:var(--night-300)}
.nav .pill{width:62px;height:34px;border-radius:999px;display:grid;place-items:center}
.nav.light a.on{color:var(--clay-700)}.nav.light a.on .pill{background:var(--sun-200)}
.nav.dark a.on{color:var(--sun)}.nav.dark a.on .pill{background:rgba(255,133,6,.18)}
.nav .fab{width:62px;height:62px;border-radius:50%;background:var(--sun);color:var(--night-900);display:grid;place-items:center;margin-top:-34px;box-shadow:inset 0 -3px 0 var(--clay),0 0 0 5px #fff,0 12px 22px -8px rgba(169,87,0,.7)}
.nav.dark .fab{box-shadow:inset 0 -3px 0 var(--clay),0 0 0 5px var(--night-900),0 12px 22px -8px rgba(0,0,0,.7)}
.nav a.create{color:var(--ink)}.nav.dark a.create{color:#fff}
/* lists */
.plist{list-style:none;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.prow{display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:12px 10px 12px 12px;box-shadow:var(--sh1)}
.pav{width:48px;height:48px;border-radius:14px;background:var(--earth);color:var(--sun-200);display:grid;place-items:center;flex:none}
.pmain{flex:1;min-width:0;display:flex;flex-direction:column}
.pname{font-size:17px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcode{font-size:17px;font-weight:800;letter-spacing:.08em;color:var(--clay-700)}
.pvis{display:flex;align-items:center;gap:5px;font-size:14px;color:var(--muted)}
.pwa{width:64px;min-height:56px;border-radius:14px;background:var(--leaf-50);color:var(--leaf);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;flex:none}
.pwa small{font-size:13px;font-weight:700}
.sechead{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px}
/* cards & bits */
.card{background:#fff;border-radius:22px;box-shadow:var(--sh2)}
.note{display:flex;gap:10px;background:var(--sun-50);border-radius:14px;padding:12px 14px;color:var(--ink);font-size:16px;line-height:1.45}
.note .ic{color:var(--clay);margin-top:1px}
.note b{display:block;font-size:14px;color:var(--clay-700);letter-spacing:.02em}
.plate{display:inline-flex;align-items:center;gap:10px;border:2px solid var(--sun);border-radius:12px;padding:4px 12px;font-weight:800;letter-spacing:.09em;font-size:20px;color:var(--ink);background:#fff;font-feature-settings:'tnum'}
.ok{display:inline-flex;align-items:center;gap:8px;background:var(--leaf-50);color:var(--leaf);font-weight:700;border-radius:999px;padding:0 14px 0 10px;height:40px;font-size:16px}
.ok .dot{width:24px;height:24px;border-radius:50%;background:var(--leaf);color:#fff;display:grid;place-items:center}
.actionbar{position:absolute;left:0;right:0;bottom:0;background:#fff;padding:12px 16px 18px;box-shadow:0 -1px 0 var(--line),0 -12px 24px -16px rgba(66,33,11,.3);z-index:9}
.progress{display:flex;gap:6px;margin:8px 0 4px}.progress i{flex:1;height:6px;border-radius:3px;background:var(--line)}.progress i.on{background:var(--sun)}
.stepl{display:flex;justify-content:space-between;font-size:14px;font-weight:600;color:var(--muted)}
.stepl b{color:var(--clay-700)}
/* streets and house numbers */
.ntag{position:absolute;transform:translate(-50%,-50%);min-width:30px;height:24px;padding:0 6px;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:3px;font-size:13px;font-weight:800;background:var(--sun-50);color:var(--earth);box-shadow:0 0 0 1.5px var(--earth),0 3px 6px -2px rgba(66,33,11,.35);z-index:1;font-feature-settings:'tnum';line-height:1}
.ntag.pub{background:var(--sun);color:var(--night-900)}
.ntag.mine{background:var(--earth);color:var(--sun-200);box-shadow:0 0 0 2px var(--sun),0 3px 6px -2px rgba(66,33,11,.35)}
.ntag.ghost{background:#fff;color:var(--clay-700);box-shadow:none;outline:2px dashed var(--clay);outline-offset:-1px}
.schip{position:absolute;transform:translate(-50%,-50%) rotate(-9deg);height:26px;padding:0 10px;border-radius:999px;background:#fff;color:var(--earth);font-size:13px;font-weight:800;display:flex;align-items:center;gap:5px;box-shadow:0 0 0 1.5px var(--earth),var(--sh1);white-space:nowrap;z-index:2}
.schip small{font-size:12px;font-weight:700;color:var(--clay-700)}
.schip.prov{box-shadow:var(--sh1);outline:1.5px dashed var(--clay);outline-offset:-1.5px}
.schip.none{color:var(--muted);box-shadow:var(--sh1);outline:1.5px dashed var(--field);outline-offset:-1.5px}
.schip.new{background:var(--sun);color:var(--night-900);box-shadow:inset 0 -2px 0 var(--clay),var(--sh1)}
.addr{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.no{display:inline-grid;place-items:center;min-width:46px;height:38px;padding:0 9px;border-radius:10px;background:var(--sun);color:var(--night-900);box-shadow:inset 0 -3px 0 var(--clay);font-feature-settings:'tnum'}
.comm{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:999px;font-size:14px;font-weight:700;color:var(--clay-700);background:#fff;box-shadow:inset 0 0 0 1.5px var(--sun-200)}
.comm.prov{box-shadow:none;outline:1.5px dashed var(--clay);outline-offset:-1.5px;background:var(--sun-50)}
.nbrs{display:flex;align-items:center;gap:10px}
.nbrs>span{font-size:14px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:5px;white-space:nowrap}
.nline{flex:1;display:flex;align-items:center}
.nline b{height:36px;min-width:52px;padding:0 8px;border-radius:10px;display:grid;place-items:center;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);font-weight:800;font-size:15px;color:var(--earth);font-feature-settings:'tnum'}
.nline b.on{background:var(--sun);color:var(--night-900);box-shadow:inset 0 -3px 0 var(--clay);min-width:58px}
.nline i{flex:1;min-width:8px;height:3px;background:repeating-linear-gradient(90deg,var(--sun) 0 6px,transparent 6px 10px)}
.nbrs.dark>span{color:var(--night-300)}.nbrs.dark .nline b{background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);color:#fff}.nbrs.dark .nline b.on{background:var(--sun);color:var(--night-900);box-shadow:inset 0 -3px 0 var(--clay)}
.backup{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:48px;border-top:1px solid var(--line);margin-top:12px;font-size:14px;color:var(--muted)}
.backup b{letter-spacing:.08em;color:var(--ink);font-weight:700;font-size:15px}
.backup a{display:flex;align-items:center;gap:6px;color:var(--clay-700);font-weight:700;min-height:48px;padding:0 4px}
/* "Y aller" sheet */
.dim{position:absolute;inset:0;background:rgba(21,23,25,.55);z-index:8}
.gosheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:28px 28px 0 0;padding:10px 16px 18px;z-index:9;animation:rise .45s ease-out both;box-shadow:0 -16px 40px -12px rgba(0,0,0,.5)}
.golist{list-style:none;margin:12px 0 12px}
.golist li{display:flex;align-items:center;gap:12px;min-height:64px;border-bottom:1px solid var(--line)}
.golist li:last-child{border-bottom:0}
.golist li>span:nth-child(2){flex:1;display:flex;flex-direction:column;line-height:1.3}
.golist b{font-size:17px}.golist small{font-size:14px;color:var(--muted)}
.golist .rec small{color:var(--clay-700);font-weight:700}
.gi{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none;box-shadow:inset 0 0 0 1px rgba(21,23,25,.08)}
.golist .ic.chev{color:var(--muted)}

.pad{padding:12px 16px 16px}
.stephead{background:#fff;padding:4px 16px 12px;box-shadow:0 1px 0 var(--line)}
.minimap{height:230px;border-radius:22px;box-shadow:var(--sh2),0 0 0 3px #fff}
.acc{position:absolute;width:104px;height:104px;border-radius:50%;transform:translate(-50%,-50%);background:rgba(255,133,6,.16);border:2px dashed rgba(169,87,0,.75);z-index:1}
.annot{position:absolute;font-family:'Architects Daughter','Segoe Print',cursive;font-size:21px;line-height:1;color:var(--earth);text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 8px #fff;z-index:4;display:flex;align-items:flex-start;gap:2px}
.rot{transform:rotate(90deg);color:var(--muted)}
.choices{display:grid;gap:10px;margin:14px 0 18px}
.choice{display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:12px;box-shadow:inset 0 0 0 1.5px var(--line),var(--sh1);min-height:76px}
.choice.sm{min-height:64px;padding:10px 12px}
.choice.on{background:var(--sun-50);box-shadow:inset 0 0 0 2.5px var(--sun),var(--sh1)}
.choice b{display:block;font-size:17px;line-height:1.3}.choice>div{flex:1}.choice>div span{color:var(--muted);line-height:1.35;display:block}
.choice em{font-style:normal;font-size:13px;font-weight:700;color:var(--clay-700);background:var(--sun-50);outline:1.5px dashed var(--clay);outline-offset:-1.5px;border-radius:999px;padding:1px 8px;margin-left:4px;vertical-align:2px}
.cic{width:44px;height:44px;border-radius:12px;background:var(--night-900);color:var(--sun);display:grid;place-items:center;flex:none}
.choice:not(.on) .cic{background:#F1EBE2;color:var(--earth)}
.radio{width:28px;height:28px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--field);flex:none;display:grid;place-items:center}
.radio.on{background:var(--sun);color:var(--night-900);box-shadow:inset 0 0 0 2px var(--clay)}
.consent{background:#fff;border-radius:20px;padding:14px 14px 4px;box-shadow:var(--sh1)}
.chead{display:flex;gap:10px;align-items:center;font-size:17px}.chead .ic{color:var(--leaf)}
.consent ul{margin:8px 0 8px 22px;line-height:1.45}.consent li{margin-bottom:4px}
.cbox{display:flex;gap:12px;align-items:center;min-height:60px;font-weight:600;line-height:1.35;border-top:1px solid var(--line);padding:8px 0}
.box{width:30px;height:30px;border-radius:8px;box-shadow:inset 0 0 0 2px var(--field);display:grid;place-items:center;flex:none}
.cbox.on .box{background:var(--leaf);color:#fff;box-shadow:none}
.numbox{display:flex;gap:12px;align-items:center;background:#fff;border-radius:18px;padding:12px;box-shadow:var(--sh1)}
.numbox .no{min-width:62px;height:56px;font-size:28px;font-weight:800;border-radius:12px}
.numbox b{display:block;font-size:17px;line-height:1.3}.numbox span{color:var(--muted);line-height:1.35;display:block}
.nmhead{display:flex;align-items:center;justify-content:space-between;margin:16px 0 8px}
.sugg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sg{min-height:100px;border-radius:16px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line),var(--sh1);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-align:center;padding:6px}
.sg .ic{color:var(--leaf)}.sg b{font-size:16px;line-height:1.2}.sg span{font-size:14px;color:var(--muted)}
.sg.on{background:var(--sun-50);box-shadow:inset 0 0 0 2.5px var(--sun),var(--sh1)}.sg.on .ic{color:var(--clay)}
.ctx{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:17px}.ctx .no{min-width:38px;height:32px;font-size:16px;font-weight:800}
.succ{background:var(--night-900) url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20width%3D'180'%20height%3D'180'%20viewBox%3D'0%200%20180%20180'%3E%3Cg%20fill%3D'none'%20stroke%3D'rgba(255%2C255%2C255%2C.05)'%20stroke-width%3D'1.5'%3E%3Cpath%20d%3D'M0%2040Q60%2030%2090%2060T180%2040'%2F%3E%3Cpath%20d%3D'M40%200Q50%2060%2030%20110T40%20180'%2F%3E%3Cpath%20d%3D'M0%20130Q90%20150%20180%20130'%2F%3E%3Cpath%20d%3D'M120%200Q110%2050%20140%2090T120%20180'%2F%3E%3Ccircle%20cx%3D'90'%20cy%3D'60'%20r%3D'7'%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E");color:#fff}
.succ::before{content:"";position:absolute;left:50%;top:120px;width:420px;height:420px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(255,133,6,.28),rgba(255,133,6,0));pointer-events:none}
.succ>*{position:relative}
.acard{margin-top:14px;position:relative;border-radius:24px;padding:16px;background:linear-gradient(160deg,#2E3136 0%,#1C1E21 70%);box-shadow:0 0 0 1px rgba(255,255,255,.09),0 26px 44px -18px rgba(0,0,0,.8);overflow:hidden;animation:rise .6s ease-out both}
.acard::before{content:"";position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20width%3D'180'%20height%3D'180'%20viewBox%3D'0%200%20180%20180'%3E%3Cg%20fill%3D'none'%20stroke%3D'rgba(255%2C133%2C6%2C.11)'%20stroke-width%3D'1.5'%3E%3Cpath%20d%3D'M0%2040Q60%2030%2090%2060T180%2040'%2F%3E%3Cpath%20d%3D'M40%200Q50%2060%2030%20110T40%20180'%2F%3E%3Cpath%20d%3D'M0%20130Q90%20150%20180%20130'%2F%3E%3Cpath%20d%3D'M120%200Q110%2050%20140%2090T120%20180'%2F%3E%3Ccircle%20cx%3D'90'%20cy%3D'60'%20r%3D'7'%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E");pointer-events:none}
.acard>*{position:relative}
.acard-top{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800;letter-spacing:-.02em}
.alabel{margin-top:16px;font-size:14px;font-weight:700;letter-spacing:.16em;color:var(--sun)}
.aplate{position:relative;margin:6px 0 12px;display:flex;align-items:center;gap:16px;height:92px;border-radius:14px;background:var(--sun);color:var(--night-900);padding:0 18px 0 22px;box-shadow:inset 0 -4px 0 var(--clay),0 12px 26px -10px rgba(255,133,6,.65)}
.aplate i{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--clay);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.aplate i:nth-child(1){left:9px;top:9px}.aplate i:nth-child(2){right:9px;top:9px}.aplate i:nth-child(3){left:9px;bottom:12px}.aplate i:nth-child(4){right:9px;bottom:12px}
.aplate .num{font-size:48px;font-weight:800;letter-spacing:-.02em;line-height:1;padding-right:16px;border-right:3px solid rgba(66,33,11,.35);font-feature-settings:'tnum'}
.aplate .st{display:flex;flex-direction:column;font-size:27px;font-weight:800;line-height:1.02;letter-spacing:.01em}
.aplate .st small{font-size:14px;letter-spacing:.18em;font-weight:700}
.aplace{color:var(--night-300);margin-bottom:12px}.aplace b{color:#fff;font-size:17px}
.acard .note{background:var(--sun-50);margin-top:12px}
.afoot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.12);font-size:14px;color:var(--night-300)}
.afoot b{color:#fff;letter-spacing:.08em;font-size:15px}
.afoot2{font-size:14px;color:var(--night-400);margin-top:4px}
.saved{display:flex;gap:8px;align-items:center;justify-content:center;color:var(--night-300);margin:14px 0 6px}
.saved .ic{color:#5BD08A}
.result{margin:-30px 12px 0;position:relative;z-index:3;padding:16px}
.sheetrow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.grow{display:flex;align-items:center;gap:12px;margin:14px 12px 0;background:var(--sun-50);border-radius:18px;padding:12px 12px 12px 14px;box-shadow:inset 0 0 0 1.5px var(--sun-200);min-height:72px}
.grow span{flex:1;line-height:1.35}.grow b{display:block;color:var(--clay-700)}
.grow>.ic{color:var(--clay-700)}
.sfield{flex:1;min-height:52px;display:flex;align-items:center;gap:6px;border:2px solid var(--field);border-radius:14px;padding:0 4px 0 12px}
.sfield .tl{flex:1;display:flex;flex-direction:column;line-height:1.15}.sfield small{font-size:13px;font-weight:700;color:var(--clay-700)}.sfield b{font-size:17px}
.rlist{list-style:none;display:grid;gap:10px;margin:14px 0}
.rrow{display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:12px;box-shadow:var(--sh1);min-height:76px}
.rrow .no{min-width:48px;height:44px;font-size:20px;font-weight:800}
.rrow>span:nth-child(2){flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.rrow b{font-size:17px}.rrow small{font-size:15px;color:var(--muted)}.rrow em{font-style:normal;font-size:14px;color:var(--clay-700);font-weight:600}
.rrow .dist{font-weight:700;color:var(--ink);white-space:nowrap}.rrow .chev{color:var(--muted)}
.tip{display:flex;gap:10px;color:var(--muted);line-height:1.45}.tip .ic{color:var(--clay);margin-top:2px}
.psub{font-size:15px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}</style></head>
